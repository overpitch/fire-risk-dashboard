name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Placeholder values so modules that create AWS/API clients at import time can load.
    # Tests mock all external calls; nothing is sent.
    env:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SYNOPTICDATA_API_KEY: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    # test_e2e.py and test_ui_rendering.py need a running server and browsers;
    # test_endpoints.py imports an app object that no longer exists (to be fixed).
    - name: Run tests
      run: |
        python -m pytest tests \
          --ignore=tests/test_e2e.py \
          --ignore=tests/test_ui_rendering.py \
          --ignore=tests/test_endpoints.py
